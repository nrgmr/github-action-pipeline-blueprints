name: Python lint and test (deprecated)

# Deprecated: call python-lint.yml and python-test.yml directly. Removed in the
# next major release.
#
# The jobs stay inline instead of calling the replacements. GitHub does not
# document which repository a relative `uses: ./...` resolves against when the
# workflow is called from another repository, and a hardcoded ref would break
# the pinning convention.

on:
  workflow_call:
    inputs:
      project-dir:
        description: "Directory containing the uv project (pyproject.toml)"
        type: string
        default: "."

jobs:
  deprecation-notice:
    name: Deprecation notice
    runs-on: ubuntu-latest
    steps:
      - run: >-
          echo "::warning title=python-lint-test.yml is deprecated::Replace it with
          python-lint.yml and python-test.yml. See docs/tools.md in rp-ci-tooling."

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - name: Install dev dependencies
        working-directory: ${{ inputs.project-dir }}
        run: uv sync --group dev
      - name: ruff check
        working-directory: ${{ inputs.project-dir }}
        run: uv run ruff check .
      - name: ruff format check
        working-directory: ${{ inputs.project-dir }}
        run: uv run ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - name: Install dev dependencies
        working-directory: ${{ inputs.project-dir }}
        run: uv sync --group dev
      - name: pytest
        working-directory: ${{ inputs.project-dir }}
        run: uv run pytest
