name: Tooling CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/python-lint.yml

  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/python-test.yml

  # These tests run oasdiff and Spectral, which the reusable test workflow does not
  # install, so they skip there and run here with the tools present.
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install oasdiff
        run: |
          curl -sSfL https://github.com/tufin/oasdiff/releases/download/v1.15.3/oasdiff_1.15.3_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin oasdiff
          oasdiff --version

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Spectral
        run: |
          npm install -g @stoplight/spectral-cli@6
          spectral --version

      # Coverage is enforced by the unit-tests job, which runs the whole suite.
      # The tests skip when a tool is missing, so a skip here means a broken install
      # and must fail the job instead of passing silently.
      # An explicit shell enables pipefail, so a pytest failure is not hidden by tee.
      - name: Test
        shell: bash
        run: |
          uv run pytest -m integration -v -rs --no-cov | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then
            echo "::error::Integration tests were skipped; oasdiff or Spectral is not usable."
            exit 1
          fi

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  secret-scan:
    name: Secret scan (self)
    uses: ./.github/workflows/secret-scan.yml
