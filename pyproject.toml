[project]
name = "rp-ci-tooling"
version = "0.6.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/gen_spec", "tests/scripts", "tests/spectral"]
pythonpath = ["scripts"]
addopts = "--cov --cov-report=term-missing"
markers = ["integration: runs oasdiff or Spectral, so the tool must be on PATH"]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
